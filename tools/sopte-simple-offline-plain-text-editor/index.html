<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SOPTE - Simple Offline Plain Text Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="author" content="Lukas W. DiBeneditto">
  <meta name="created" content="2025-09-12">
  <meta name="description" content="A privacy-focused, browser-based plain text editor that works offline to open, edit, and save text files directly to your computer.">
  <meta name="keywords" content="simple, offline, plain, text, editor">
  <meta name="modified" content="2026-05-28">
  <meta name="publisher" content="dibeneditto.com">
  <meta name="version" content="1.16">
  <link rel="canonical" href="https://dibeneditto.com/tools/sopte-simple-offline-plain-text-editor/">
  <link rel="home" href="https://dibeneditto.com/">
  <link rel="shortcut icon" href="/favicon.ico">


<style>

  /* ===== Reset / base ===== */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  
  :root{
    /* Single source of truth for editor metrics */
    --editor-font-family: monospace;
    --editor-font-size: 1rem;      /* 16px */
    --editor-line-height: 1.25rem; /* 20px */
    --editor-padding: .5rem;       /* 8px top/bottom/left/right */
  }
  
  body{
    display: flex;
    flex-direction: column;
    font-family: system-ui, sans-serif;
  }
  
  /* ===== Header / Footer ===== */
  header{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    padding: .5rem;
    gap: .5rem;
    background: #F0F0F0;
    border-bottom: 1px solid #d0d0d0;
  }
  header .location{ margin: 0; }
  
  footer{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    padding: .5rem;
    gap: .5rem;
    background: #F0F0F0;
    border-top: 1px solid #d0d0d0;
  }

  #footerInfo{
    margin-left: auto;
    color: #666;
  }

  footer .editorStatus{
    display: flex;
    align-items: baseline;
    gap: .5rem;
    white-space: nowrap;
  }

  #statusText{
    line-height: 1;
  }
  
  .editorStatus select{
    margin-left: 0;
    height: auto;
    line-height: 1.2;
    padding: .1em .3em;
    font-family: var(--editor-font-family);
  }
  
  /* ===== Main layout ===== */
  main{
    display: flex;
    flex: 1;
    min-height: 0;
    padding: 0;
    gap: 0;
    align-items: stretch;
    background: transparent;
  }
  
  /* ===== Editor + Line Numbers ===== */
  #editorWrapper{
    display: flex;
    flex: 1;
    min-height: 0;
    width: 100%;
    overflow: hidden;
  }
  
  /* Keep typography IDENTICAL across editor, mirror, and gutter */
  #editor,
  #editorMirror,
  #lineNumbers{
    font-family: var(--editor-font-family);
    font-size:   var(--editor-font-size);
    line-height: var(--editor-line-height);
  }
  
  /* Textarea */
  #editor{
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    padding: var(--editor-padding);
    overflow: auto; /* vertical + (maybe) horizontal */
    background: #fff;
  }
  
  /* Gutter */
  #lineNumbers{
    background: #f0f0f0;
    color: #666;
    text-align: right;
    user-select: none;
    overflow: hidden;         /* scroll synced from JS */
    padding-top: var(--editor-padding);
    padding-bottom: var(--editor-padding);
    /* left/right padding */
    padding-left: .5rem;
    padding-right: .5rem;
  }
  
  /* Hidden mirror for wrapped-line measurement */
  #editorMirror{
    position: absolute;
    visibility: hidden;
    pointer-events: none;
    white-space: pre-wrap;      /* synced further in JS when wrap toggles */
    overflow-wrap: break-word;
    word-break: normal;
    box-sizing: border-box;     /* width/padding/borders are synced in JS */
  }
  
  /* ===== Menu buttons / file name row ===== */
  #menu{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .35rem;
    width: 100%;
  }

  #menuControls{
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: .25rem .35rem;
  }

  #fileNameRow{
    display: flex;
    align-items: baseline;
    gap: .4rem;
    width: 100%;
    min-width: 0;
    flex-wrap: nowrap;
  }

  #fileNameRow label{
    white-space: nowrap;
    line-height: 1;
  }

  #fileName{
    flex: 1 1 42rem;
    min-width: 12rem;
    max-width: 100%;
    height: auto;
    line-height: 1.2;
    padding: .1em .3em;
    font-family: var(--editor-font-family);
  }

  #appStatus{
    width: 100%;
    min-width: 0;
    min-height: 1.25rem;
    line-height: 1.25rem;
    color: #555;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    text-align: left;
    opacity: 0;
    transition: opacity 400ms ease;
  }

  #appStatus.is-visible{ opacity: 1; }

  @media (prefers-reduced-motion: reduce){
    #appStatus{ transition: none; }
  }

  body.is-dragging-file #editorWrapper{
    outline: .15rem dashed #999;
    outline-offset: -.15rem;
  }

  #menu button, .button{
    display: inline;
    background: #F0F0F0;
    vertical-align: middle;
    height: 1.4rem;
  }
  #menu .button{ padding: 0 0 0 .2rem; }
  #menuControls .button:first-of-type{
    margin-left: .75rem;
    padding-left: .75rem;
    border-left: 1px solid #d0d0d0;
  }
  #menu button:hover, .button:hover{ background: #D0D0D0; }

  button:focus-visible,
  input:focus-visible,
  select:focus-visible,
  textarea:focus-visible{
    outline: .15rem solid #555;
    outline-offset: .1rem;
  }

</style>

</head>
<body>

<header>
  <p class="location"><a href="https://dibeneditto.com/">dibeneditto.com</a> ⇒ <a href="/tools/">tools</a> ⇒ <strong>SOPTE - Simple Offline Plain Text Editor</strong></p>

  <div id="menu">
    <div id="menuControls">
      <button id="newBtn" type="button" accesskey="n">New file</button>
      <button id="openBtn" type="button">Open file</button>
      <button id="saveBtn" type="button">Save file</button>
      <button id="saveAsBtn" type="button">Save file as</button>

      <div class="button">
        <label for="spellcheck">Spell check</label>
        <input id="spellcheck" type="checkbox">
      </div>

      <div class="button">
        <label for="linewrap">Line wrap</label>
        <input id="linewrap" type="checkbox" checked>
      </div>
    </div>

    <div id="fileNameRow">
      <label for="fileName">File name:</label>
      <input id="fileName" type="text" value="untitled.txt" autocomplete="off" spellcheck="false">
    </div>

    <div id="appStatus" role="status" aria-live="polite" aria-atomic="true"></div>

    <input id="fileInput" type="file" hidden>
  </div>
</header>

<main>
  <div id="editorWrapper">
    <div id="lineNumbers"></div>
    <textarea id="editor" spellcheck="false"></textarea>
    <!-- Hidden mirror used to calculate wrapped rows -->
    <div id="editorMirror" aria-hidden="true"></div>
  </div>
</main>

<footer>
  <span class="editorStatus">
    <span id="statusText">length: 0 lines: 1 ln: 1 col: 1 pos: 1</span>
    <select id="eolSelect">
      <option value="lf">Unix (LF)</option>
      <option value="crlf">Windows (CR LF)</option>
      <option value="cr">Macintosh (CR)</option>
    </select>
  </span>
  <span id="footerInfo">© Lukas DiBeneditto, <a href="https://dibeneditto.com">dibeneditto.com</a>, <a href="https://github.com/dibeneditto/dibeneditto.github.io/edit/main/tools/sopte-simple-offline-plain-text-editor/index.html">[edit]</a>, <span id="versionText"></span></span>
</footer>

<script>

  // --- DOM element references ---
  // Grab references to key UI elements in the page so we can control them with JS.
  const editor     = document.getElementById('editor');      // main <textarea>
  const newBtn     = document.getElementById('newBtn');      // "New File" button
  const openBtn    = document.getElementById('openBtn');     // "Open File" button
  const saveBtn    = document.getElementById('saveBtn');     // "Save File" button
  const saveAsBtn  = document.getElementById('saveAsBtn');   // "Save File As" button
  const fileNameIn = document.getElementById('fileName');    // editable current filename field
  const appStatus  = document.getElementById('appStatus');   // live app status message
  const fileIn     = document.getElementById('fileInput');   // hidden <input type=file>
  const spellCb    = document.getElementById('spellcheck');  // spellcheck toggle checkbox
  const eolSelect  = document.getElementById('eolSelect');   // dropdown for line-ending style
  const statusText = document.getElementById('statusText');  // footer status bar text
  const versionText = document.getElementById('versionText'); // footer version/date text


  // --- Control metric sync ---
  // Match the filename input and EOL selector to the editor's computed text
  // metrics without changing the editor itself. This keeps the controls visually
  // aligned with the editor's monospace text while preserving the editor metrics
  // as the single source of truth.
  function syncTextControlMetricsFromEditor() {
    const cs = getComputedStyle(editor);

    for (const el of [fileNameIn, eolSelect]) {
      el.style.fontFamily = cs.fontFamily;
      el.style.fontSize = cs.fontSize;
      el.style.lineHeight = cs.lineHeight;
      el.style.paddingTop = cs.paddingTop;
      el.style.paddingBottom = cs.paddingBottom;
    }
  }


  // --- State variables ---
  // Handle to the real local file selected through the File System Access API.
  //
  // Important:
  // - lastName only stores the filename as text.
  // - currentFileHandle stores permission/path access to the actual file.
  // - Without this handle, the browser cannot overwrite the original local file.
  let currentFileHandle = null;

  // Name of the current file.
  // Used for status, snapshots, and suggested filename when doing Save As / first save.
  let lastName = 'untitled.txt';

  // Last editor value that was successfully saved.
  // Used by isDirty() and beforeunload warning logic.
  //
  // This may be set to null after restoring an unsaved recovery snapshot
  // so the restored text still counts as dirty until it is saved or discarded.
  let lastSavedValue = '';

  // When a restored dirty recovery snapshot needs lastSavedValue = null,
  // keep the prior saved buffer length here so future empty dirty snapshots
  // can still be distinguished from meaningless blank recovery copies.
  let recoverySavedTextLength = null;


  // --- Helpers ---
  // Returns true if there are unsaved edits in the editor buffer.
  function isDirty() {

    return editor.value !== lastSavedValue;

  }


  // Moves caret to the start of the textarea, scrolls back to top,
  // and focuses the editor (used after file open/load/new).
  function focusAtStart(el) {

    try { el.setSelectionRange(0, 0); } catch {} // safe caret move

    el.scrollTop = 0;  // make sure scroll is at the top
    el.focus();        // focus the editor so user can type immediately
  }




  // =========================
  // Metadata helpers
  // =========================

  // Read a <meta name="..." content="..."> value.
  function getMetaContent(name, fallback = '') {
    const el = document.querySelector(`meta[name="${name}"]`);
    return el ? el.content : fallback;
  }


  // Fill the visible footer version/date text from the meta tags.
  function updateVersionText() {
    if (!versionText) return;

    const version = getMetaContent('version', '').trim();
    const modified = getMetaContent('modified', '').trim();

    if (version && modified) {
      versionText.textContent = `Version ${version} (${modified})`;
    } else if (version) {
      versionText.textContent = `Version ${version}`;
    } else if (modified) {
      versionText.textContent = `Modified ${modified}`;
    } else {
      versionText.textContent = '';
    }
  }



  // =========================
  // App status helpers
  // =========================

  let appStatusTimer = null;
  let appStatusClearTimer = null;

  // Show a short, accessible status message without moving focus.
  // The element uses role="status" in the HTML, so screen readers can
  // announce updates politely while the visual message fades out.
  function showAppStatus(message, visibleMs = 4000) {
    clearTimeout(appStatusTimer);
    clearTimeout(appStatusClearTimer);

    const text = String(message || '').trim();
    appStatus.textContent = text;
    appStatus.title = text;

    if (!text) {
      appStatus.classList.remove('is-visible');
      return;
    }

    appStatus.classList.add('is-visible');

    appStatusTimer = setTimeout(() => {
      appStatus.classList.remove('is-visible');

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const clearDelay = reduceMotion ? 0 : 450;

      appStatusClearTimer = setTimeout(() => {
        if (!appStatus.classList.contains('is-visible')) {
          appStatus.textContent = '';
          appStatus.title = '';
        }
      }, clearDelay);
    }, visibleMs);
  }


  // =========================
  // File name field helpers
  // =========================

  // Clean user-entered filenames so they are safe as Save As suggestions.
  //
  // This does not create directories or accept paths. It only keeps a filename.
  function cleanSuggestedFileName(name) {
    const fallback = 'untitled.txt';

    const cleaned = String(name || fallback)
      .trim()
      .replace(/[\\/:*?"<>|\x00-\x1F]/g, '_') // Windows/path/control-invalid chars
      .slice(0, 240);

    return cleaned || fallback;
  }


  // Update the visible File Name input from lastName.
  function syncFileNameInput() {
    fileNameIn.value = cleanSuggestedFileName(lastName);
  }


  // Commit the File Name input back into lastName.
  //
  // If the user manually changes the filename, we clear currentFileHandle.
  // That prevents a dangerous mismatch where the input says one filename
  // but Save File silently overwrites a different file handle.
  function commitFileNameInput() {
    const nextName = cleanSuggestedFileName(fileNameIn.value);

    if (fileNameIn.value !== nextName) {
      fileNameIn.value = nextName;
    }

    if (nextName !== lastName) {
      lastName = nextName;
      currentFileHandle = null;
      scheduleAutosave();
      showAppStatus('File name changed. Use Save File to choose where to save.');
      return true;
    }

    return false;
  }


  // When the user finishes editing the File Name field, treat that as a
  // rename/save-as intent. The next Save File will ask where to save.
  fileNameIn.addEventListener('change', commitFileNameInput);



  // =========================
  // Local File System helpers
  // =========================
  
  // Returns true if the browser supports direct local file open/save.
  //
  // This is needed because the File System Access API is not supported everywhere.
  // Chrome and Edge support it well. Firefox/Safari may not.
  // If unsupported, the app can still fall back to the old download behavior.
  function supportsFileSystemAccess() {
    return (
      'showOpenFilePicker' in window &&
      'showSaveFilePicker' in window
    );
  }
  
  

  // File type filters shared by Open and Save As.
  //
  // This is intentionally broad because this is a plain text editor.
  // You can add/remove extensions as needed.
  const textFileTypes = [
    {
      description: 'Text files',
      accept: {
        'text/plain': [
          '.txt',
          '.md',
          '.js',
          '.html',
          '.css',
          '.json',
          '.csv',
          '.tsv',
          '.xml',
          '.svg',
          '.log'
        ]
      }
    }
  ];
  
  
  // Options used only when opening an existing file.
  //
  // multiple belongs here because showOpenFilePicker() can technically
  // allow selecting more than one file. This editor only opens one file.
  const openFilePickerOptions = {
    types: textFileTypes,
  
    // Allow the user to choose other file types too.
    // This matters for extensionless files or uncommon text formats.
    excludeAcceptAllOption: false,
  
    // This editor only opens one file at a time.
    multiple: false
  };
  
  
  // Options used only when choosing where to save a new file.
  //
  // Do not include multiple here. showSaveFilePicker() saves one file.
  const saveFilePickerOptions = {
    types: textFileTypes,
  
    // Allow the user to choose other file types too.
    // This matters for extensionless files or uncommon text formats.
    excludeAcceptAllOption: false
  };
  
  
  // Ask the browser whether we already have permission to read/write this file.
  // If not, request permission from the user.
  //
  // readWrite = true means we need write permission, not just read permission.
  async function verifyFilePermission(fileHandle, readWrite = false) {
    const options = readWrite ? { mode: 'readwrite' } : {};
  
    // If permission was already granted, do not prompt again.
    if ((await fileHandle.queryPermission(options)) === 'granted') {
      return true;
    }
  
    // If permission was not already granted, ask the user.
    if ((await fileHandle.requestPermission(options)) === 'granted') {
      return true;
    }
  
    // User denied permission.
    return false;
  }
  
  
  // Write text to an existing file handle.
  //
  // This is the real "Save" behavior.
  // It writes to the same local file that was opened or previously chosen.
  async function writeToFileHandle(fileHandle, contents) {
    // Create a writable stream to the local file.
    const writable = await fileHandle.createWritable();
  
    // Write the full file contents.
    await writable.write(contents);
  
    // Closing commits the write to disk.
    await writable.close();
  }
  
  
  // Old fallback save behavior.
  //
  // This does NOT overwrite the original file.
  // It creates a browser download.
  // Keep it only for browsers that do not support direct local file saving.
  function downloadFileFallback(filename, contents) {
    const blob = new Blob([contents], { type: 'text/plain;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
  
    const a = document.createElement('a');
    a.href = url;
    a.download = filename || 'untitled.txt';
  
    document.body.appendChild(a);
    a.click();
    a.remove();
  
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }
  
  
  // Centralized file-load routine.
  //
  // This avoids duplicating the same editor setup logic between:
  // - modern File System Access open
  // - old file input fallback open
  function loadTextIntoEditor(text, fileName) {
    editor.value = text;
    lastName = cleanSuggestedFileName(fileName || 'untitled.txt');
    syncFileNameInput();
    lastSavedValue = editor.value;
    recoverySavedTextLength = null;
  
    // Detect if the file uses one consistent line-ending style.
    // If mixed, leave the dropdown alone so the user can decide.
    const { kinds } = detectMixedEOLKinds(text);
  
    if (kinds === 1) {
      const detected = detectEOL(text);
  
      eolSelect.value =
        detected === 'Windows (CR LF)' ? 'crlf' :
        detected === 'Macintosh (CR)' ? 'cr' :
        'lf';
    }
  
    updateStatus();
    focusAtStart(editor);
    updateLineNumbers();
    scheduleAutosave();
  }


  // --- EOL (End Of Line) helpers ---
  // Text files use different newline characters depending on the OS:
  //   Windows: "\r\n" (carriage return + line feed)
  //   Old MacOS (pre-OSX): "\r" (carriage return only)
  //   Unix/Linux/macOS: "\n" (line feed only)
  // These helpers let us detect and convert between them consistently.


  // Detects the *first* newline style found in a given text.
  function detectEOL(text) {

    if (/\r\n/.test(text)) return 'Windows (CR LF)';  // found CRLF pairs
    if (/\r/.test(text))   return 'Macintosh (CR)';   // found standalone CRs
    if (/\n/.test(text))   return 'Unix (LF)';        // found LF

    return 'Unix (LF)';    // fallback if no newlines at all
  }


  // Detects if a text buffer has a mix of newline kinds.
  function detectMixedEOLKinds(text) {

    const hasCRLF = /\r\n/.test(text);              // check for Windows style
    const noCRLF = text.replace(/\r\n/g, '');       // strip CRLF to avoid double-counting
    const hasCR  = /\r/.test(noCRLF);               // check for classic Mac style
    const hasLF  = /\n/.test(noCRLF);               // check for Unix style

    // Count how many distinct types exist in the text
    const kinds = (hasCRLF ? 1 : 0) + (hasCR ? 1 : 0) + (hasLF ? 1 : 0);

    return { hasCRLF, hasCR, hasLF, kinds };        // return detailed breakdown
  }


  // Normalize all line endings in a given text to a specific style.
  function normalizeEOL(text, style) {

    // Step 1: unify everything into LF ("\n")
    let t = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

    // Step 2: convert LF into the requested style
    if (style === 'lf')   return t;                     // keep LF as-is
    if (style === 'crlf') return t.replace(/\n/g, '\r\n'); // convert LF → CRLF
    if (style === 'cr')   return t.replace(/\n/g, '\r');   // convert LF → CR
    return text; // if style is invalid, leave text unchanged
  }



  // =========================
  // Caret (cursor) helpers
  // =========================

  // Find the caret index (character position) based on which end of the selection is "active".
  // - If user selected backwards (Shift+ArrowUp), caret is at selectionStart.
  // - If forwards (normal typing/selection), caret is at selectionEnd.
  // - If neither, default to the end of the selection or buffer.
  function activeCaretIndex(el) {
    try {
      const { selectionStart, selectionEnd, selectionDirection } = el;
      if (selectionDirection === 'backward') return selectionStart;
      if (selectionDirection === 'forward')  return selectionEnd;
      return selectionEnd ?? selectionStart ?? el.value.length;
    } catch {
      // If selection APIs not available, fallback: caret is at end
      return el.value.length;
    }
  }

  // Given a caret index, compute:
  // - line number
  // - column number
  // - absolute position (1-based)
  function computeCaretMetrics(text, caretIndex) {
    const upToCaret = text.slice(0, caretIndex);      // substring before caret
    const linesArr  = upToCaret.split(/\r\n|\n|\r/);  // split into lines
    const lineNo    = linesArr.length;                // number of lines so far
    const colNo     = (linesArr[linesArr.length - 1] || '').length + 1; // col = chars in last line +1
    const pos       = caretIndex + 1;                 // absolute position (1-based)
    return { lineNo, colNo, pos };
  }



  // =========================
  // Status bar updater
  // =========================

  // Recompute document stats and caret metrics, then show them in footer.
  function updateStatus() {
    const text = editor.value;
    const length = text.length;
    const lines = (length === 0) ? 1 : text.split(/\r\n|\n|\r/).length;

    // Figure out where caret is
    const caret = activeCaretIndex(editor);
    const { lineNo, colNo, pos } = computeCaretMetrics(text, caret);

    // Non-breaking spaces for spacing in footer
    const SPACER = '\u00A0\u00A0';
    const GAP  = SPACER + SPACER + SPACER;

    // Example: "length: 120  lines: 6     ln: 3  col: 12  pos: 57"
    statusText.textContent =
      'length: ' + length +
      SPACER + 'lines: ' + lines +
      GAP + 'ln: ' + lineNo +
      SPACER + 'col: ' + colNo +
      SPACER + 'pos: ' + pos +
      SPACER;
  }

  // Helper to sync the EOL dropdown to whatever we detect in the file
  function setSelectFromDetected(text) {
    const detected = detectEOL(text);
    if (detected === 'Windows (CR LF)') eolSelect.value = 'crlf';
    else if (detected === 'Macintosh (CR)') eolSelect.value = 'cr';
    else eolSelect.value = 'lf';
  }



  // =========================
  // TAB-SAFE AUTOSAVE / RECOVERY
  // =========================

  // Unique ID for this browser tab.
  // - Prefer crypto.randomUUID() if available.
  // - Fallback: timestamp + random hex string.
  const TAB_ID = (crypto.randomUUID ? crypto.randomUUID() :
                 (Date.now() + ':' + Math.random().toString(16).slice(2)));

  // Keys used in localStorage
  const SNAP_BASE  = 'offline-editor:snapshot:' + location.pathname; // scope snapshots by URL path
  const SNAP_KEY   = `${SNAP_BASE}:${TAB_ID}`;                       // per-tab snapshot key
  const INDEX_KEY  = `${SNAP_BASE}:index`;                           // shared index of all tabs
  const INDEX_LIMIT = 6;                                             // keep only N most recent snapshots

  // ----- Index helpers -----

  // Read the index of snapshots from localStorage
  function readIndex() {
    try {
      const raw = localStorage.getItem(INDEX_KEY);
      const idx = raw ? JSON.parse(raw) : {};
      return (idx && typeof idx === 'object') ? idx : {};
    } catch {
      return {};
    }
  }

  // Write the index back, with optional mutation logic
  function writeIndex(mutator) {
    const idx = readIndex();

  // Keyup → catch caret moves from arrow keys, Home/End, etc.
  editor.addEventListener('keyup', updateStatus);

  // Mouse interactions → click/mouseup/dblclick may move caret or selection
  editor.addEventListener('click', rafUpdate);
  editor.addEventListener('mouseup', rafUpdate);
  editor.addEventListener('dblclick', rafUpdate);

  // Selection change (e.g., Shift+Arrow, keyboard shortcuts)
  editor.addEventListener('select', rafUpdate);

  // Global selection change (needed because some browsers only fire at document)
  document.addEventListener('selectionchange', () => {
    if (document.activeElement === editor) updateStatus();
  });

  // Focus → when the editor gains focus, refresh status display
  editor.addEventListener('focus', updateStatus);


  // =========================
  // Drag-and-drop file open
  // =========================

  let dragFileDepth = 0;

  // Return true when the drag/drop payload appears to contain files.
  function dataTransferHasFiles(dataTransfer) {
    if (!dataTransfer) return false;

    const types = Array.from(dataTransfer.types || []);
    return types.includes('Files') || (dataTransfer.files && dataTransfer.files.length > 0);
  }


  // Extract the first usable file from a drop event.
  //
  // In Chromium browsers, a dropped file may expose a FileSystemFileHandle.
  // When available, we keep that handle so Save File can write back to the
  // same dropped file. Otherwise, we still open the File object, but Save File
  // will need to ask where to save because there is no writable handle.
  async function getFirstDroppedFile(dataTransfer) {
    const items = Array.from(dataTransfer?.items || []);
    const fileItems = items.filter(item => item.kind === 'file');

    for (const item of fileItems) {
      // Modern Chromium path: try to preserve a writable file handle.
      if (typeof item.getAsFileSystemHandle === 'function') {
        try {
          const handle = await item.getAsFileSystemHandle();

          if (handle && handle.kind === 'file') {
            const file = await handle.getFile();
            return { file, handle, fileCount: fileItems.length };
          }
        } catch {
          // Fall through to the plain File path below.
        }
      }

      // Broad fallback path: opens the file, but cannot save back to it directly.
      const file = item.getAsFile ? item.getAsFile() : null;
      if (file) return { file, handle: null, fileCount: fileItems.length };
    }

    // Last-resort fallback for browsers that expose only dataTransfer.files.
    const files = Array.from(dataTransfer?.files || []);
    if (files.length > 0) {
      return { file: files[0], handle: null, fileCount: files.length };
    }

    return null;
  }


  // Open a file dropped anywhere on the app.
  async function openDroppedFile(e) {
    e.preventDefault();
    e.stopPropagation();

    try {
      const dropped = await getFirstDroppedFile(e.dataTransfer);

      if (!dropped || !dropped.file) {
        showAppStatus('No dropped file to open.');
        return;
      }

      if (isDirty()) {
        const ok = confirm('Changes you made may not be saved. Open dropped file?');
        if (!ok) {
          showAppStatus('File drop canceled.');
          return;
        }
      }

      currentFileHandle = dropped.handle || null;

      const text = await dropped.file.text();
      loadTextIntoEditor(text, dropped.file.name);

      if (dropped.fileCount > 1) {
        showAppStatus('Opened first dropped file.');
      } else if (currentFileHandle) {
        showAppStatus('File opened');
      } else {
        showAppStatus('File opened. Use Save File As to save changes.');
      }

    } catch (err) {
      console.error(err);
      showAppStatus('Could not open dropped file.');
      alert('Could not open dropped file.');
    }
  }


  window.addEventListener('dragenter', (e) => {
    if (!dataTransferHasFiles(e.dataTransfer)) return;

    e.preventDefault();
    dragFileDepth++;
    document.body.classList.add('is-dragging-file');
  });


  window.addEventListener('dragover', (e) => {
    if (dataTransferHasFiles(e.dataTransfer)) {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = 'copy';
      return;
    }

    // Preserve the old safety behavior: prevent non-editor drops from
    // navigating away, while still allowing native text drops into the editor.
    if (!editor.contains(e.target)) e.preventDefault();
  });


  window.addEventListener('dragleave', (e) => {
    if (!dataTransferHasFiles(e.dataTransfer)) return;

    dragFileDepth = Math.max(0, dragFileDepth - 1);
    if (dragFileDepth === 0) {
      document.body.classList.remove('is-dragging-file');
    }
  });


  window.addEventListener('drop', async (e) => {
    document.body.classList.remove('is-dragging-file');
    dragFileDepth = 0;

    if (dataTransferHasFiles(e.dataTransfer)) {
      await openDroppedFile(e);
      return;
    }

    // Preserve the old safety behavior for non-file drops.
    if (!editor.contains(e.target)) e.preventDefault();
  });

  // Before unload: warn if unsaved changes
  window.addEventListener('beforeunload', (e) => {
    if (editor.value !== lastSavedValue) {
      e.preventDefault();
      e.returnValue = ''; // required for Chrome/Edge/Firefox to show a prompt
    }
  });

  // Initial: defaults + try recovery
  const currentSpellcheck = editor.getAttribute('spellcheck');
  spellCb.checked = (currentSpellcheck === 'true') ? true : false;

  // Always default to Windows CRLF on first load of the app
  eolSelect.value = 'crlf';

  // Normalize the current buffer (empty or prefilled) to CRLF visually,
  // but do not mutate the user's file until Save.
  editor.value = normalizeEOL(editor.value, 'crlf');

  // Mark the buffer as "clean" at startup (so beforeunload won't warn immediately)
  lastSavedValue = editor.value;
  recoverySavedTextLength = null;

  // Match filename and EOL selector metrics to the editor's computed metrics.
  syncTextControlMetricsFromEditor();

  // Make sure the visible File Name field matches the current filename state.
  syncFileNameInput();

  // Fill visible version/date text from the meta tags.
  updateVersionText();

  // Paint initial status line
  updateStatus();

  // Try to restore a previous unsaved session (same path) if one exists and was dirty
  tryRestoreSnapshot();

  // Begin autosaving snapshots for crash/tab-close recovery
  scheduleAutosave();

  // First-load focus + caret at start (after initial setup)
  focusAtStart(editor);

</script>

</body>
</html>
